name: Deploy GHOST Runtime Control

on:
  push:
    branches:
      - main
    paths:
      - "lambda/runtime_control/**"
      - "infrastructure/ghost_runtime_control_stack.yaml"
      - "ragstream/mcp/auth.py"
      - "tests/runtime_control/**"
      - "Makefile"
      - "requirements.txt"
      - ".github/workflows/deploy-runtime-control.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-runtime-control-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  SAM_STACK_NAME: ghost-runtime-control

jobs:
  validate-build-deploy:
    name: Test, build, and deploy runtime control
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Deploy manually or through a commit containing [deploy-runtime].
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy-runtime]')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            lambda/runtime_control/requirements.txt

      - name: Install test and Lambda dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest>=8.2,<9" \
            "boto3>=1.34,<2" \
            --requirement lambda/runtime_control/requirements.txt

      - name: Run runtime-control tests
        run: |
          pytest -q tests/runtime_control/test_runtime_control_lambda.py

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM infrastructure
        run: |
          sam validate \
            --lint \
            --template-file infrastructure/ghost_runtime_control_stack.yaml

      - name: Build Lambda deployment artifact
        run: |
          sam build \
            --template-file infrastructure/ghost_runtime_control_stack.yaml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy runtime-control stack
        run: |
          set -euo pipefail

          read_parameter() {
            aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "$1" \
              --query "Parameter.Value" \
              --output text
          }

          MANAGED_INSTANCE_ID="$(
            read_parameter \
              /ghost/runtime-control/config/managed-instance-id
          )"

          ROUTE53_HOSTED_ZONE_ID="$(
            read_parameter \
              /ghost/runtime-control/config/route53-hosted-zone-id
          )"

          COGNITO_ISSUER="$(
            read_parameter \
              /ghost/runtime-control/config/cognito-issuer
          )"

          COGNITO_APP_CLIENT_ID="$(
            read_parameter \
              /ghost/runtime-control/config/cognito-app-client-id
          )"

          COGNITO_REQUIRED_SCOPE="$(
            read_parameter \
              /ghost/runtime-control/config/cognito-required-scope
          )"

          ALLOWED_COGNITO_SUBJECT="$(
            read_parameter \
              /ghost/runtime-control/config/allowed-cognito-subject
          )"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$SAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --s3-prefix ghost-runtime-control \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ManagedInstanceId="$MANAGED_INSTANCE_ID" \
              Route53HostedZoneId="$ROUTE53_HOSTED_ZONE_ID" \
              CognitoIssuer="$COGNITO_ISSUER" \
              CognitoAppClientId="$COGNITO_APP_CLIENT_ID" \
              CognitoRequiredScope="$COGNITO_REQUIRED_SCOPE" \
              AllowedCognitoSubject="$ALLOWED_COGNITO_SUBJECT"